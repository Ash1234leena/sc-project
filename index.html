<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Figma UI to Code</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }


.card {
  background: white;
  width: 300px;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  text-align: center;
}

.card h2 {
  margin-bottom: 10px;
  font-size: 22px;
}

.card p {
  color: #555;
  font-size: 14px;
  margin-bottom: 20px;
}

.btn {
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.btn:hover {
  background-color: #45a049;
}

  </style>
</head>
<body>

  <div class="card">
    <h2>Welcome</h2>
    <p>This UI is converted from Figma design.</p>
    <button class="btn">Click Me</button>
  </div>

</body>
</html>
